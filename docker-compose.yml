
services:
  postgres:
    image: postgres:17
    container_name: albion_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: albion_db
      POSTGRES_USER: albion_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
